# Pipeline to restore single linearizer for ci_cpp_gen3.
# See DM-52448
description: cp_pipe LATISS linearizer calibration construction.
instrument: lsst.obs.lsst.Latiss
imports:
  - location: $CP_PIPE_DIR/pipelines/LATISS/cpLinearizer.yaml
tasks:
  cpLinearizerPtcExtractPair:
    class: lsst.cp.pipe.ptc.PhotonTransferCurveExtractPairTask
    config:
      useEfdPhotodiodeData: False
  # Leave the normalizer in to exercise the code and have a record.
  cpLinearizerUnnormalizedSolve1:
    class: lsst.cp.pipe.LinearitySolveTask
    config:
      useLinearizerPtc: true
      useFocalPlaneNormalization: false
      connections.inputLinearizerPtc: "linearizerPtc"
      connections.outputLinearizer: "linearizerUnnormalized1"
      linearityType: "Spline"
      splineKnots: 5
      trimmedState: false
      maxLinearAdu: 120000
      usePhotodiode: false
  cpLinearizerNormalize1:
    class: lsst.cp.pipe.LinearityNormalizeTask
    config:
      normalizeDetectors: [0]
      referenceDetector: 0
      doNormalizeAbsoluteLinearizer: false
  # But turn off the normalization because one detector
  # is not enough to run it reliably.
  cpLinearizerSolve:
    class: lsst.cp.pipe.LinearitySolveTask
    config:
      useLinearizerPtc: true
      connections.inputLinearizerPtc: "linearizerPtc"
      connections.outputLinearizer: "linearizer"
      connections.inputNormalization: "cpLinearizerNormalization1"
      linearityType: "Spline"
      splineKnots: 5
      trimmedState: false
      maxLinearAdu: 120000
      usePhotodiode: false
      useFocalPlaneNormalization: false
